name: "Optimus AI — Autonomous 24/7 Discovery Agent"

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC) at $0 cost
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      backfill_query:
        description: 'Optional company or category to deep backfill (e.g., "Google", "DeepSeek", "Coding Agents")'
        required: false
        default: ''
      dry_run:
        description: 'Run in safe dry-run mode without external API calls'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  autonomous_sync:
    name: "Optimus Spark 24/7 Discovery & Directory Sync"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Optimus Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Optimus Autonomous Discovery Agent"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          BACKFILL="${{ github.event.inputs.backfill_query }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          if [ -n "$BACKFILL" ]; then
            echo "Executing Deep Historical Backfill for: $BACKFILL"
            python agent/optimus_assistant.py --backfill "$BACKFILL" $FLAGS --limit 10
          else
            echo "Executing Autonomous 24/7 Scheduled Sync"
            python agent/optimus_assistant.py --cron $FLAGS --limit 8
          fi

      - name: "Commit & Push Updated Directory and Changelog"
        run: |
          git config user.name "Optimus Spark Agent [Bot]"
          git config user.email "optimus-agent@users.noreply.github.com"
          
          # Check if data files were modified
          if git status --porcelain data/ | grep -E "(ai_directory.json|changelog.md)"; then
            echo "Detected directory updates. Committing changes..."
            git add data/ai_directory.json data/changelog.md
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "🤖 [Optimus Spark] Autonomous Directory Sync - ${TIMESTAMP} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Changes successfully pushed to repository."
          else
            echo "No directory updates detected in this cycle. Skipping commit."
          fi
